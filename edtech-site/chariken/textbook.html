<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちゃり検｜教科書で学ぶ</title>
<style>
:root{
  --bg:#f5f3ee;--surface:#fff;--border:#e2ddd5;--text:#1a1a18;--muted:#7a7870;
  --accent:#17288B;--accent-light:#eef0fa;--r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 64px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 24px}
.logo{font-size:18px;font-weight:700;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
.logo em{color:var(--accent);font-style:normal}
.back-link{font-size:13px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--accent)}

.page-title{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.page-sub{font-size:13.5px;color:var(--muted);line-height:1.8;margin-bottom:24px;max-width:560px}

.cat-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cat-row{border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.cat-head:hover{background:var(--bg)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{font-size:14.5px;font-weight:600;flex:1}
.cat-cnt{font-size:12px;color:var(--muted)}
.cat-chevron{font-size:12px;color:var(--muted);transition:transform .15s}
.cat-row.open .cat-chevron{transform:rotate(90deg)}
.cat-panel{display:none;padding:0 16px 18px 38px}
.cat-row.open .cat-panel{display:block}
.cat-desc{font-size:13px;color:var(--muted);line-height:1.85;margin-bottom:12px}
.cat-cta{display:inline-block;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;background:var(--accent-light);padding:7px 14px;border-radius:20px}
.cat-cta:hover{background:#dfe4f7}

.loading{font-size:13px;color:var(--muted);padding:1rem 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="start.html" class="logo">ちゃり<em>検</em></a>
    <a href="start.html" class="back-link">← 選択に戻る</a>
  </div>

  <div class="page-title">教科書で学ぶ</div>
  <p class="page-sub">10のカテゴリごとに、自転車のルールを読んで学べます。気になるカテゴリをタップして開いてください。</p>

  <div class="cat-list" id="cat-list">
    <div class="loading">読み込み中…</div>
  </div>
</div>

<script>
const SUPABASE_URL='https://hwxreikopltisfoimuzf.supabase.co';
const SUPABASE_KEY='sb_publishable_IibWbT-1J9MeXGN5XkJfMw_PqsRfgsi';

const CATS=[
  {name:'走行ルール',color:'#17288B',desc:'車道の左側通行、車両通行帯の走り方など、自転車が道路を走るときの基本ルールです。'},
  {name:'信号機の種類',color:'#BA7517',desc:'歩行者用・車両用・自転車用信号など、信号の種類とそれぞれの意味を学びます。'},
  {name:'道路標識',color:'#1D9E75',desc:'一時停止や進入禁止など、街中でよく見る道路標識の意味を確認します。'},
  {name:'危険行為禁止',color:'#E24B4A',desc:'2026年4月の青切符制度で取り締まりの対象となる、危険な運転行為について学びます。'},
  {name:'走行判断',color:'#7F77DD',desc:'交差点や見通しの悪い場所など、とっさの判断が必要な場面の考え方を学びます。'},
  {name:'事故対応',color:'#888780',desc:'万が一事故にあったとき・起こしてしまったときの正しい対応の仕方です。'},
  {name:'安全対策',color:'#D4537E',desc:'ヘルメットの着用やライトの点灯など、事故を未然に防ぐための備えです。'},
  {name:'青切符・法律',color:'#854F0B',desc:'2026年4月に施行された青切符制度の仕組みと、対象になる違反について学びます。'},
  {name:'自転車マナー',color:'#D4537E',desc:'歩行者や他の車両への配慮など、気持ちよく道路を使うためのマナーです。'},
  {name:'自転車整備・安全',color:'#7F77DD',desc:'ブレーキや空気圧など、安全に走るために欠かせない日常点検のポイントです。'},
];

function api(path,opts={}){
  return fetch(SUPABASE_URL+path,{...opts,headers:{
    'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json',...(opts.headers||{})
  }});
}

async function init(){
  const list=document.getElementById('cat-list');
  let counts={};
  try{
    const res=await api('/rest/v1/questions?status=eq.active&select=category');
    if(res.ok){
      const rows=await res.json();
      rows.forEach(r=>counts[r.category]=(counts[r.category]||0)+1);
    }
  }catch(e){/* 件数が取れなくても一覧は表示する */}

  list.innerHTML='';
  CATS.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='cat-row';
    const cnt=counts[c.name]||0;
    row.innerHTML=`
      <div class="cat-head" onclick="toggleCat(${i})">
        <div class="cat-dot" style="background:${c.color}"></div>
        <div class="cat-name">${c.name}</div>
        <div class="cat-cnt">${cnt}問</div>
        <div class="cat-chevron">▶</div>
      </div>
      <div class="cat-panel">
        <div class="cat-desc">${c.desc}</div>
        <a class="cat-cta" href="guest.html?category=${encodeURIComponent(c.name)}">この分野の問題を解く →</a>
      </div>
    `;
    list.appendChild(row);
  });
}

function toggleCat(i){
  const rows=document.querySelectorAll('.cat-row');
  const row=rows[i];
  const wasOpen=row.classList.contains('open');
  rows.forEach(r=>r.classList.remove('open'));
  if(!wasOpen)row.classList.add('open');
}

init();
</script>
</body>
</html>
