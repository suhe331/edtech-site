<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちゃり検｜はじめる</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--border:#e4e9ef;--text:#2a1f2e;--muted:#6b7280;
  --accent:#17288B;--accent2:#3271d8;--accent-light:#eef3ff;--teal:#3D737A;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.site-header{background:var(--surface);border-bottom:1px solid var(--border);height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:700;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
.logo em{color:var(--accent2);font-style:normal}
.back-link{font-size:13px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:48px 20px 64px}
.page-title{font-size:28px;font-weight:700;text-align:center}
.page-sub{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 36px}

.main-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:680px){.main-grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(23,40,139,.1)}
.icon{font-size:36px;line-height:1;margin-bottom:6px}
.ttl{font-size:20px;font-weight:700}
.desc{font-size:13px;color:var(--muted);line-height:1.8}
.cta{margin-top:auto;padding-top:12px;font-size:14px;font-weight:700;color:var(--accent)}

.illust{margin-top:16px;border-left:4px solid #00DDFA;flex-direction:row;align-items:center;gap:16px;padding:20px 24px}
.illust .icon{margin:0}
.illust .body{flex:1}
.illust .ttl{font-size:17px}
.illust .arrow{font-size:18px;font-weight:700;color:var(--teal)}
.illust:hover{border-color:#00DDFA;box-shadow:0 4px 16px rgba(0,221,250,.18)}
</style>
</head>
<body>
<header class="site-header">
  <a href="index.html" class="logo">ちゃり<em>検</em></a>
  <a href="index.html" class="back-link">← トップへ戻る</a>
</header>

<div class="wrap">
  <h1 class="page-title">ログイン</h1>
  <p class="page-sub">あてはまる方を選んでください。</p>

  <div class="main-grid">
    <a href="app.html" class="card">
      <div class="icon">🎒</div>
      <div class="ttl">生徒ログイン</div>
      <div class="desc">学校コード・学年・組・出席番号・ニックネームで入ります。</div>
      <div class="cta">生徒の方はこちら →</div>
    </a>
    <a href="teacher.html" class="card">
      <div class="icon">🧑‍🏫</div>
      <div class="ttl">教員ログイン</div>
      <div class="desc">学校コードで入ります。学習イベントの作成やクラスの確認ができます。</div>
      <div class="cta">先生の方はこちら →</div>
    </a>
  </div>

  <a href="safety.html" class="card illust">
    <div class="icon">🎨</div>
    <div class="body">
      <div class="ttl">イラストで学ぶ</div>
      <div class="desc">ログイン不要。イラストを見ながら、自転車の安全ルールを学べます。</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>
</body>
</html>
