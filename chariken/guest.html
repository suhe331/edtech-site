<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちゃり検｜ログインなしでテスト</title>
<style>
:root{
  --bg:#f5f3ee;--surface:#fff;--border:#e2ddd5;--text:#1a1a18;--muted:#7a7870;
  --accent:#17288B;--accent-light:#eef0fa;--correct:#16a34a;--correct-light:#f0fdf4;
  --wrong:#dc2626;--wrong-light:#fef2f2;--r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.25rem 1rem 3rem}
.wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
.screen{display:none;flex-direction:column;gap:14px}
.screen.active{display:flex}

.topbar{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:700;letter-spacing:-.5px;text-decoration:none;color:var(--text)}
.logo em{color:var(--accent);font-style:normal}
.back-link{font-size:12px;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--accent)}
.guest-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--accent-light);color:var(--accent)}

.intro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.intro-title{font-size:18px;font-weight:700;margin-bottom:8px}
.intro-desc{font-size:13.5px;color:var(--muted);line-height:1.85;margin-bottom:18px}
.intro-note{font-size:12px;color:var(--muted);background:var(--bg);padding:10px 12px;border-radius:var(--rs);line-height:1.7;margin-bottom:18px}
.btn-primary{font-size:15px;font-weight:700;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;width:100%}
.btn-primary:hover{background:#0f1c63}

.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.q-head{display:flex;align-items:center;gap:8px;padding:.7rem 1.25rem;border-bottom:0.5px solid var(--border);background:var(--bg)}
.q-num{font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:11px;padding:3px 9px;border-radius:20px}
.badge-cat{background:var(--accent-light);color:var(--accent);font-weight:600;margin-left:auto}
.q-body{padding:1.25rem}
.q-text{font-size:16px;line-height:1.75;margin-bottom:1.25rem;font-weight:500}
.q-photo-wrap{margin-bottom:1rem}
.q-photo-wrap img{width:100%;max-height:260px;object-fit:contain;border-radius:var(--rs);border:0.5px solid var(--border);background:var(--bg)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{width:100%;text-align:left;font-size:14px;line-height:1.6;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rs);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--correct);background:var(--correct-light);color:var(--correct)}
.choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-light);color:var(--wrong)}
.choice-lbl{font-size:12px;font-weight:700;min-width:20px;padding-top:1px}
.feedback{margin-top:1rem;padding:1rem;border-radius:var(--rs);font-size:14px;line-height:1.7;display:none}
.feedback.correct{background:var(--correct-light);color:#15803d;border:1px solid #bbf7d0}
.feedback.wrong{background:var(--wrong-light);color:#b91c1c;border:1px solid #fecaca}
.fb-title{font-weight:700;margin-bottom:4px}
.law-ref{font-size:12px;margin-top:6px;opacity:.8}
.nav-area{display:flex;justify-content:flex-end}
.btn-next{font-size:14px;font-weight:600;padding:10px 28px;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;display:none}

.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px;text-align:center}
.result-num{font-size:40px;font-weight:700;color:var(--accent);letter-spacing:-1px}
.result-lbl{font-size:12px;color:var(--muted);margin-top:2px;margin-bottom:22px}
.result-note{font-size:13px;color:var(--muted);line-height:1.85;background:var(--bg);border-radius:var(--rs);padding:14px;margin-bottom:18px}

.loading{font-size:13px;color:var(--muted);text-align:center;padding:2rem 0}
.error-msg{font-size:13px;padding:.7rem 1rem;background:var(--wrong-light);color:var(--wrong);border-radius:var(--rs);display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="start.html" class="logo">ちゃり<em>検</em></a>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="guest-badge">ゲスト受験</span>
      <a href="start.html" class="back-link">← 選択に戻る</a>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <!-- 開始画面 -->
  <div class="screen active" id="screen-intro">
    <div class="intro-card">
      <div class="intro-title">ログインなしでテスト</div>
      <div class="intro-desc">登録なしで、その場ですぐに5問解けます。難易度はランダムに出題されます。</div>
      <div class="intro-note">⚠️ ゲスト受験の結果は保存されません。学習の記録やクラスランキングを残したい場合は、学校コードでのログインをおすすめします。</div>
      <button class="btn-primary" onclick="startQuiz()">5問はじめる</button>
    </div>
  </div>

  <div class="loading" id="loading" style="display:none">読み込み中…</div>

  <!-- 問題 -->
  <div class="screen" id="screen-quiz">
    <div>
      <div class="progress-meta"><span id="progress-text">1 / 5問</span><span id="progress-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-head">
        <span class="q-num" id="q-num">Q1</span>
        <span class="badge badge-cat" id="cat-badge">カテゴリ</span>
      </div>
      <div class="q-body">
        <div class="q-photo-wrap" id="q-photo-wrap" style="display:none">
          <img id="q-photo" src="" alt="問題の写真">
        </div>
        <div class="q-text" id="q-text"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback">
          <div class="fb-title" id="fb-title"></div>
          <div id="fb-body"></div>
          <div class="law-ref" id="fb-law"></div>
        </div>
      </div>
    </div>
    <div class="nav-area">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>

  <!-- 結果 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <div class="result-num" id="res-correct">0 / 5</div>
      <div class="result-lbl">正解数（ゲスト受験・記録には残りません）</div>
      <div class="result-note">続けて学習を記録したり、クラスのイベントに参加したりするには、学校コードでログインしてください。</div>
      <button class="btn-primary" onclick="location.href='app.html'">学校コードでログインする</button>
      <div style="height:8px"></div>
      <button class="btn-primary" style="background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)" onclick="location.reload()">もう一度ゲストで試す</button>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL='https://hwxreikopltisfoimuzf.supabase.co';
const SUPABASE_KEY='sb_publishable_IibWbT-1J9MeXGN5XkJfMw_PqsRfgsi';
const QUIZ_SIZE=5;
let questions=[],currentIdx=0,correctCount=0,answered=false;
const selectedCategory=new URLSearchParams(location.search).get('category');

(function applyCategoryToIntro(){
  if(!selectedCategory)return;
  document.addEventListener('DOMContentLoaded',()=>{
    document.querySelector('.intro-title').textContent=selectedCategory+'を解いてみる';
    document.querySelector('.intro-desc').textContent=`「${selectedCategory}」から、その場ですぐに5問解けます。`;
  });
})();

function api(path,opts={}){
  return fetch(SUPABASE_URL+path,{...opts,headers:{
    'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json',...(opts.headers||{})
  }});
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showError(msg){const el=document.getElementById('error-msg');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',4000)}

async function startQuiz(){
  document.getElementById('loading').style.display='block';
  try{
    const catFilter=selectedCategory?`&category=eq.${encodeURIComponent(selectedCategory)}`:'';
    const res=await api(`/rest/v1/questions?status=eq.active${catFilter}&select=*&limit=200`);
    if(!res.ok)throw new Error(await res.text());
    const all=await res.json();
    if(!all.length)throw new Error('問題が見つかりませんでした');
    // shuffle and take QUIZ_SIZE
    for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
    questions=all.slice(0,QUIZ_SIZE);
    currentIdx=0;correctCount=0;
    document.getElementById('loading').style.display='none';
    showScreen('screen-quiz');
    renderQuestion();
  }catch(e){
    document.getElementById('loading').style.display='none';
    showError('問題の取得に失敗しました: '+e.message);
  }
}

function renderQuestion(){
  const q=questions[currentIdx];
  answered=false;
  const pct=Math.round(currentIdx/questions.length*100);
  document.getElementById('progress-text').textContent=`${currentIdx+1} / ${questions.length}問`;
  document.getElementById('progress-pct').textContent=pct+'%';
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('q-num').textContent=`Q${currentIdx+1}`;
  document.getElementById('cat-badge').textContent=q.category;

  document.getElementById('q-text').textContent=q.question_text;
  const photoWrap=document.getElementById('q-photo-wrap');
  if(q.photo_url){
    document.getElementById('q-photo').src=q.photo_url;
    photoWrap.style.display='block';
  }else{
    photoWrap.style.display='none';
  }

  const choices=typeof q.choices==='string'?JSON.parse(q.choices):q.choices;
  const labels=['ア','イ','ウ','エ'];
  const container=document.getElementById('choices');
  container.innerHTML='';
  choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.innerHTML=`<span class="choice-lbl">${labels[i]}</span><span>${c}</span>`;
    btn.onclick=()=>selectAnswer(i,q);
    container.appendChild(btn);
  });
  document.getElementById('feedback').style.display='none';
  document.getElementById('btn-next').style.display='none';
}

function selectAnswer(idx,q){
  if(answered)return;
  answered=true;
  const correct=idx===q.correct_index;
  document.querySelectorAll('.choice-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===q.correct_index)btn.classList.add('correct');
    else if(i===idx&&!correct)btn.classList.add('wrong');
  });
  if(correct)correctCount++;
  const fb=document.getElementById('feedback');
  fb.style.display='block';
  fb.className='feedback '+(correct?'correct':'wrong');
  document.getElementById('fb-title').textContent=correct?'正解！':`不正解　正解は「${['ア','イ','ウ','エ'][q.correct_index]}」`;
  document.getElementById('fb-body').textContent=q.explanation||'';
  document.getElementById('fb-law').textContent=q.law_ref?'📖 '+q.law_ref:'';
  document.getElementById('btn-next').style.display='inline-block';
}

function nextQuestion(){
  currentIdx++;
  if(currentIdx>=questions.length){
    document.getElementById('res-correct').textContent=`${correctCount} / ${questions.length}`;
    showScreen('screen-result');
    return;
  }
  renderQuestion();
}
</script>
</body>
</html>
